name: sim-engine-workflow-lab
services:
  n8n:
    image: ${N8N_LAB_IMAGE:-docker.n8n.io/n8nio/n8n:2.47.7}
    ports:
      - "127.0.0.1:5680:5678"
    environment:
      TZ: Europe/Berlin
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [lab]
    depends_on: [fixtures]
  fixtures:
    build:
      context: ../..
      dockerfile: deploy/n8n/fixtures.Dockerfile
    command: ["python", "-m", "sim_engine.workflow_lab.cli", "fixtures", "--host", "0.0.0.0", "--db", "/data/fixtures.sqlite"]
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - fixture_data:/data
    networks: [lab]
networks:
  lab:
    internal: true
volumes:
  n8n_data:
  fixture_data:
